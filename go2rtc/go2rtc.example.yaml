# Copy this file to go2rtc.yaml (same folder as go2rtc.exe) and fill in the
# camera IP / username / password. go2rtc.yaml is git-ignored because it
# contains camera credentials.
#
# Dahua RTSP format:
#   rtsp://USER:PASS@IP:554/cam/realmonitor?channel=1&subtype=0   -> main stream
#   rtsp://USER:PASS@IP:554/cam/realmonitor?channel=1&subtype=1   -> sub stream
# If the password contains special characters (@ : / # ?), URL-encode them,
# e.g. "@" -> %40.
# "#backchannel=0" stops go2rtc from opening the camera's two-way-audio
# channel (the -A model has a mic), which can otherwise block the stream.

api:
  listen: ":1984"

webrtc:
  listen: ":8555"

streams:
  cam1_sub:  rtsp://admin:@Cctvfid13@10.99.27.10:554/cam/realmonitor?channel=1&subtype=1
  cam1_main: rtsp://admin:@Cctvfid13@10.99.27.10:554/cam/realmonitor?channel=1&subtype=0